# Subprocess spawning is the primary sandbox-escape vector: a tool that shells
# out directly bypasses every Landlock/seccomp restriction sandbx applies.
#
# These bans are workspace-wide. `sandbx-core` is the only crate that may call
# them, and it does so behind `SandboxedCommand` with an explicit
# `#[allow(clippy::disallowed_methods)]` and a justification at the call site.
#
# Enforced on every commit via the pre-commit hook (`cargo clippy -- -D warnings`).
disallowed-methods = [
    { path = "std::process::Command::new", reason = "spawn via sandbx_core::SandboxedCommand so Landlock/seccomp restrictions are applied" },
    # allow-invalid: sandbx-providers' dev-dependency on tokio omits the
    # "process" feature, so this path does not resolve there — clippy would
    # otherwise warn per-crate about an "invalid" entry. The ban still applies
    # in full wherever tokio::process actually is reachable.
    { path = "tokio::process::Command::new", reason = "spawn via sandbx_core::SandboxedCommand so Landlock/seccomp restrictions are applied", allow-invalid = true },
]
