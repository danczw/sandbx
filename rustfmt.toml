# The four rustfmt options the Google Rust style guide names (#328 decision 11c, #334).
# Three are nightly-only, so the gate runs them on the nightly `public-api.sh` already
# pins while the build stays on stable; `guide-ci.md` has why it greps its own output.

# rustfmt's own default, set explicitly because the guide names the number and a default
# is not a promise.
max_width = 100

hex_literal_case = "Lower"

# Inert until the workspace defines a `macro_rules!`; set now so the first one written is
# formatted without this file changing in the same commit.
format_macro_matchers = true

# One `use` statement per module, so no `::` appears inside a `{}` group. The guide states
# this one as a rule rather than as an optional formatting setting, which is why it is set
# on a codebase that could otherwise have skipped the nightly altogether.
imports_granularity = "Module"
