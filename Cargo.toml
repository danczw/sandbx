[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.10"
edition = "2024"
# Held up by two independent things: the let-chain in `helper`, and the `icu_*`
# crates reached via reqwest -> url -> idna. Lowering it needs both changed.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/danczw/sandbx"
# Also lets path dependencies omit a version without cargo-deny reading it as a
# registry wildcard.
publish = false

# `sandbx-core` opts in too: the one site that spawns carries its own `#[allow]`,
# which is narrower than exempting the crate.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Method list: clippy.toml.
disallowed_methods = "deny"
