[workspace]
resolver = "3"
members = ["crates/*"]

# Shared metadata — member crates inherit these with `field.workspace = true`,
# so version/edition are bumped in one place instead of seven.
[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/danczw/sandbx"
# Distribution is GitHub Releases only (see context/PLAN.md). Saying so here
# makes an accidental `cargo publish` fail, and lets internal path dependencies
# omit a version without cargo-deny reading it as a registry wildcard.
publish = false

# Shared lint config — member crates opt in with `[lints] workspace = true`.
# `sandbx-core` deliberately does NOT opt in: it is the only crate allowed to
# contain `unsafe` code or spawn subprocesses directly.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The actual method list lives in clippy.toml at the workspace root.
disallowed_methods = "deny"
