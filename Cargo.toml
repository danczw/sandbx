[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.18"
edition = "2024"
# Held up by two independent things: the let-chain in `helper`, and the `icu_*`
# crates reached via reqwest -> url -> idna. Lowering it needs both changed.
# `--ignore-rust-version` is for a local try, never CI: there it makes this
# line cosmetic.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/danczw/sandbx"
# Also lets path dependencies omit a version without cargo-deny reading it as a
# registry wildcard.
publish = false

# `sandbx-core` opts in too: the one site that spawns carries its own `#[allow]`,
# which is narrower than exempting the crate.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# The half `crates/*/public-api.txt` cannot see. A `pub` under a private parent
# never reaches the baseline, so widening one leaves no line for a reviewer to
# read — and during #328's extractions `pub` is the cheapest way to make a moved
# item compile. This is the compiler saying the intent and the reachability
# disagree; `pub(crate)` is what was meant. Allow-by-default upstream only
# because it fires on so much existing code.
unreachable_pub = "warn"
# The other direction: a type reachable through a signature but not nameable, so
# a caller can hold it and never write it down. `unreachable_pub`'s own docs
# name this as the leak it does not cover.
unnameable_types = "warn"

[workspace.lints.clippy]
# Method list: clippy.toml.
disallowed_methods = "deny"
