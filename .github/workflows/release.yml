name: Release

# Nothing publishes on a branch push, so a merge cannot ship a binary by itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 0

jobs:
  build:
    # Gated on `notes` so a malformed file fails in seconds rather than after
    # two native legs, one of them a paid arm runner.
    needs: notes
    # Native per target, not cross-compiled: the enforcement step below is the
    # gate, and run on x86 it proves nothing about an arm binary.
    strategy:
      fail-fast: false
      # musl, not gnu: a glibc build records the build machine's glibc as a
      # *minimum* version, so it refuses to start on an older distribution.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same SHA as ci.yml's rust-toolchain steps; why `v1` and not `stable` is there.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No cache here, unlike ci.yml: this build is published, and a cache entry
      # any PR run could have written is attacker-influenced input to it.

      # Nothing else checks this pairing, and the enforcement gate and the musl
      # compiler below both rest on it: a mismatch would cross-compile and
      # publish a green result proving nothing.
      - name: Check the runner matches the target
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) want=x86_64 ;;
            aarch64-*) want=aarch64 ;;
            *) echo "::error::no architecture known for ${{ matrix.target }}"; exit 1 ;;
          esac
          got="$(uname -m)"
          echo "target=${{ matrix.target }} want=$want uname=$got"
          if [ "$got" != "$want" ]; then
            echo "::error::${{ matrix.target }} needs a $want runner, but this is $got"
            exit 1
          fi

      # A tag claiming v0.1.0 that builds 0.2.0 would publish the wrong binary
      # behind the right name, and nothing downstream would notice.
      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "sandbx-cli") | .version')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match crate version $crate"
            exit 1
          fi

      # `ring` reaches the binary through `sandbx-providers` and its build.rs
      # compiles C, so both steps below need a C compiler for the musl target.
      # `musl-dev`, pulled in here, installs the `<arch>-linux-musl-gcc` name
      # cc-rs looks for, so no `CC_*` override. Native per the check above.
      - name: Install the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The binary's whole claim is that it sandboxes, so enforcement gates the
      # release and not only the merge — against the published triple, the
      # artifact being static musl that a host-gnu run says nothing about.
      # `--locked`, so the graph tested is the graph the build below ships.
      - name: Test, including real sandbox enforcement
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sandbx-cli

      - name: Package
        run: |
          name="sandbx-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/sandbx README.md LICENSE "dist/$name/"
          # A dynamic executable here would mean a hidden glibc floor again.
          file "dist/$name/sandbx" | grep -q "statically linked\|static-pie" \
            || { echo "::error::binary is not statically linked"; exit 1; }
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  # Committed rather than generated, so the prose is reviewed with the change.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release notes
        run: |
          .github/scripts/check-release-notes.sh \
            "docs/release-notes/${GITHUB_REF_NAME}.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: docs/release-notes/${{ github.ref_name }}.md
          if-no-files-found: error

  # Separate so `gh release create` runs once whatever the matrix size, and so
  # `contents: write` is confined to a job that checks out no source.
  publish:
    needs: [build, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout here, so `gh` has no git remote to infer the repo from.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Not `--generate-notes`: gh documents prepending for `--notes` only.
      - name: Compose the notes
        run: |
          # `-e` does not fire on a failed $(cat) below, so test for the file.
          notes="dist/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          # --jq renders a 404 as the string `null` and an empty body as a
          # newline, so a size test passes on both.
          grep -q '[^[:space:]]' generated.md && ! grep -qx 'null' generated.md \
            || { echo "::error::generate-notes returned no PR list"; exit 1; }
          # $(cat) strips trailing newlines, so the join is exactly one blank
          # line and `## What's Changed` cannot land mid-line.
          printf '%s\n\n' "$(cat "$notes")" > notes.md
          cat generated.md >> notes.md

      # A hyphenated tag is published as a pre-release, so the "latest" link
      # never points at one. An unsuffixed pre-1.0 tag is not covered (#142).
      - name: Publish
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256
