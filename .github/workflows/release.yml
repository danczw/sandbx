name: Release

# Nothing publishes on a branch push, so a merge cannot ship a binary by itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 0

jobs:
  build:
    # Native per target, not cross-compiled: the enforcement step below is the
    # gate, and run on x86 it proves nothing about an arm binary.
    strategy:
      fail-fast: false
      # musl, not gnu: a glibc build records the build machine's glibc as a
      # *minimum* version, so it refuses to start on an older distribution.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same SHA as ci.yml's rust-toolchain steps; why `v1` and not `stable` is there.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No cache here, unlike ci.yml: this build is published, and a cache entry
      # any PR run could have written is attacker-influenced input to it.

      # Nothing else checks this pairing, and the enforcement claim below rests on
      # it: a mismatch would cross-compile and publish a green result proving
      # nothing.
      - name: Check the runner matches the target
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) want=x86_64 ;;
            aarch64-*) want=aarch64 ;;
            *) echo "::error::no architecture known for ${{ matrix.target }}"; exit 1 ;;
          esac
          got="$(uname -m)"
          echo "target=${{ matrix.target }} want=$want uname=$got"
          if [ "$got" != "$want" ]; then
            echo "::error::${{ matrix.target }} needs a $want runner, but this is $got"
            exit 1
          fi

      # A tag claiming v0.1.0 that builds 0.2.0 would publish the wrong binary
      # behind the right name, and nothing downstream would notice.
      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "sandbx-cli") | .version')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match crate version $crate"
            exit 1
          fi

      # The binary's whole claim is that it sandboxes. Shipping one whose
      # enforcement tests were never run is the specific failure this project
      # cannot afford, so they gate the release rather than only the merge.
      # Covers the architecture being published, not the artifact: with no
      # `--target` this builds the host gnu triple while the binary ships static
      # musl. See #130.
      - name: Test, including real sandbox enforcement
        run: cargo test --workspace --features sandbox-integration

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sandbx-cli

      - name: Package
        run: |
          name="sandbx-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/sandbx README.md LICENSE "dist/$name/"
          # A dynamic executable here would mean a hidden glibc floor again.
          file "dist/$name/sandbx" | grep -q "statically linked\|static-pie" \
            || { echo "::error::binary is not statically linked"; exit 1; }
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  # Separate so `gh release create` runs once whatever the matrix size, and so
  # `contents: write` is confined to a job that checks out no source.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # So the "latest" link never points at a build whose sandbox is still
      # moving.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so `gh` has no git remote to infer the repo from.
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256
