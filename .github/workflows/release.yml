name: Release

# Tags only: a merge cannot ship a binary by itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Workflow-wide, unlike ci.yml: two *tags* race, each reading the published
# release set before either has published into it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 0

jobs:
  build:
    # After `notes`, so a malformed file fails before two native legs, one paid.
    needs: notes
    strategy:
      fail-fast: false
      # musl, not gnu: a glibc build needs the build machine's glibc or newer.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same SHA as ci.yml's toolchain steps; why `v1`, not `stable`, is there.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No cache, unlike ci.yml: any PR run could have written the entry, and
      # this build is published.

      # The enforcement gate below rests on this pairing: a mismatch would
      # cross-compile and go green proving nothing.
      - name: Check the runner matches the target
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) want=x86_64 ;;
            aarch64-*) want=aarch64 ;;
            *) echo "::error::no architecture known for ${{ matrix.target }}"; exit 1 ;;
          esac
          got="$(uname -m)"
          echo "target=${{ matrix.target }} want=$want uname=$got"
          if [ "$got" != "$want" ]; then
            echo "::error::${{ matrix.target }} needs a $want runner, but this is $got"
            exit 1
          fi

      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "sandbx-cli") | .version')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match crate version $crate"
            exit 1
          fi

      # Same step as ci.yml's; why a musl C compiler is needed is there.
      - name: Install the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Enforcement gates the release, not only the merge; see SECURITY.md.
      # `--locked`: the graph tested is the graph shipped.
      - name: Test, including real sandbox enforcement
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sandbx-cli

      - name: Package
        run: |
          name="sandbx-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/sandbx README.md LICENSE "dist/$name/"
          file "dist/$name/sandbx" | grep -q "statically linked\|static-pie" \
            || { echo "::error::binary is not statically linked"; exit 1; }
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  notes:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release notes
        run: |
          .github/scripts/check-release-notes.sh \
            "docs/release-notes/${GITHUB_REF_NAME}.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: docs/release-notes/${{ github.ref_name }}.md
          if-no-files-found: error

      # Not in `build`: matrix legs writing one output map are last-writer-wins.
      - name: Classify the tag
        id: classify
        run: |
          channel="$(.github/scripts/release-channel.sh "$GITHUB_REF_NAME")"
          echo "channel=$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # Here rather than in `publish`, which has no checkout to run the script
      # from. The query is in the workflow because the script may not make one.
      - name: Decide whether this tag takes the latest link
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Not a pipe: no `pipefail` by default, so a failed call would read as
          # an empty release set and answer `true`.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > published.txt
          # Empty would answer `true` unchallenged, and this repository has
          # releases, so it means the query broke.
          [ -s published.txt ] || { echo "::error::no releases returned"; exit 1; }
          latest="$(.github/scripts/release-channel.sh --latest \
            "$GITHUB_REF_NAME" < published.txt)"
          echo "latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  # Separate so `gh release create` runs once whatever the matrix size, and so
  # `contents: write` is confined to a job that checks out no source.
  publish:
    needs: [build, notes]
    runs-on: ubuntu-latest
    # `id-token` lives here, not in `build`: its tests and build scripts run
    # dependency code.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout here, so `gh` has no git remote to infer the repo from.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Not `--generate-notes`: gh documents prepending for `--notes` only.
      - name: Compose the notes
        run: |
          # `-e` does not fire on a failed $(cat) below, so test for the file.
          notes="dist/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          # `--jq` renders a 404 as the string `null` and an empty body as a
          # newline, so a size test would pass on both.
          grep -q '[^[:space:]]' generated.md && ! grep -qx 'null' generated.md \
            || { echo "::error::generate-notes returned no PR list"; exit 1; }
          # $(cat) strips trailing newlines: the join is exactly one blank line.
          printf '%s\n\n' "$(cat "$notes")" > notes.md
          cat generated.md >> notes.md

      # Before `Publish`, so a failed attestation leaves no release without one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish
        env:
          CHANNEL: ${{ needs.notes.outputs.channel }}
          LATEST: ${{ needs.notes.outputs.latest }}
        run: |
          # Empty `$CHANNEL` means the handoff broke; defaulting to pre-release
          # would hide that until 1.0.
          prerelease=()
          case "$CHANNEL" in
            release) ;;
            prerelease) prerelease=(--prerelease) ;;
            *) echo "::error::unusable channel: '$CHANNEL'"; exit 1 ;;
          esac
          case "$LATEST" in
            true | false) ;;
            *) echo "::error::unusable latest: '$LATEST'"; exit 1 ;;
          esac
          # `make_latest` defaults to true: publication order would pick the
          # link and a backport would demote its own line.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --latest="$LATEST" \
            "${prerelease[@]}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256
