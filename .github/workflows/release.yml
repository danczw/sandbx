name: Release

# Nothing publishes on a branch push, so a merge cannot ship a binary by itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 0

jobs:
  build:
    # Gated on `notes` so a malformed file fails before two native legs, one paid.
    needs: notes
    strategy:
      fail-fast: false
      # musl, not gnu: a glibc build records the build machine's glibc as a
      # *minimum* version, so it refuses to start on an older distribution.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same SHA as ci.yml's rust-toolchain steps; why `v1` and not `stable` is there.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No cache here, unlike ci.yml: this build is published, and a cache entry
      # any PR run could have written is attacker-influenced input to it.

      # Nothing else checks this pairing, and the enforcement gate below rests on
      # it: a mismatch would cross-compile and publish a green result proving nothing.
      - name: Check the runner matches the target
        run: |
          case "${{ matrix.target }}" in
            x86_64-*) want=x86_64 ;;
            aarch64-*) want=aarch64 ;;
            *) echo "::error::no architecture known for ${{ matrix.target }}"; exit 1 ;;
          esac
          got="$(uname -m)"
          echo "target=${{ matrix.target }} want=$want uname=$got"
          if [ "$got" != "$want" ]; then
            echo "::error::${{ matrix.target }} needs a $want runner, but this is $got"
            exit 1
          fi

      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "sandbx-cli") | .version')"
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag does not match crate version $crate"
            exit 1
          fi

      # Same step as ci.yml's; why a musl C compiler is needed is there.
      - name: Install the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Enforcement gates the release and not only the merge; see SECURITY.md.
      # `--locked`, so the graph tested is the graph the build below ships.
      - name: Test, including real sandbox enforcement
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sandbx-cli

      - name: Package
        run: |
          name="sandbx-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/sandbx README.md LICENSE "dist/$name/"
          file "dist/$name/sandbx" | grep -q "statically linked\|static-pie" \
            || { echo "::error::binary is not statically linked"; exit 1; }
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  notes:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release notes
        run: |
          .github/scripts/check-release-notes.sh \
            "docs/release-notes/${GITHUB_REF_NAME}.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: docs/release-notes/${{ github.ref_name }}.md
          if-no-files-found: error

      # Here and not in `build`, which is a matrix: two legs writing one output
      # map is last-writer-wins.
      - name: Classify the tag
        id: classify
        run: |
          channel="$(.github/scripts/release-channel.sh "$GITHUB_REF_NAME")"
          echo "channel=$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # Separate so `gh release create` runs once whatever the matrix size, and so
  # `contents: write` is confined to a job that checks out no source.
  publish:
    needs: [build, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout here, so `gh` has no git remote to infer the repo from.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Not `--generate-notes`: gh documents prepending for `--notes` only.
      - name: Compose the notes
        run: |
          # `-e` does not fire on a failed $(cat) below, so test for the file.
          notes="dist/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          # `--jq` renders a 404 as the string `null` and an empty body as a
          # newline, so a size test would pass on both.
          grep -q '[^[:space:]]' generated.md && ! grep -qx 'null' generated.md \
            || { echo "::error::generate-notes returned no PR list"; exit 1; }
          # $(cat) strips trailing newlines, so the join is exactly one blank line.
          printf '%s\n\n' "$(cat "$notes")" > notes.md
          cat generated.md >> notes.md

      - name: Publish
        env:
          CHANNEL: ${{ needs.notes.outputs.channel }}
        run: |
          # An empty `$CHANNEL` means the handoff broke, and defaulting it to
          # pre-release would be right for every pre-1.0 tag and hide that until 1.0.
          prerelease=()
          case "$CHANNEL" in
            release) ;;
            prerelease) prerelease=(--prerelease) ;;
            *) echo "::error::unusable channel: '$CHANNEL'"; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${prerelease[@]}" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256
