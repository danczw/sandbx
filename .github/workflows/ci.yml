name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories appear without a code change.
  schedule:
    - cron: "0 6 * * 1"

# Replaces the repo default with exactly this, so a compromised action cannot
# push or publish. Nothing needs git credentials after the clone either, so
# every checkout drops the token rather than leaving it in `.git/config`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail rather than silently retry on a flaky registry.
  CARGO_NET_RETRY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `v1`, not `stable`: the `stable` branch is regenerated as master plus one
      # commit, so a SHA pinned from it is reachable from no ref once master
      # moves, and dependabot can then never bump it.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # Default features: the pass that sees the crates as a consumer does, so
      # production code reaching a test-only item behind a feature
      # (`sandbx-providers`' MockProvider) fails here, not at tag time.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `mock` unlocks the test target `required-features` gates, which is what
      # lets the Clippy pass above stay default-features. Excludes
      # sandbox-integration and the live-credential tests.
      - name: Test
        run: cargo test --workspace --features sandbx-providers/mock

      # The `context/guide-*.md` files point at doc comments for the detail, so a
      # link that stops resolving takes a reader to nothing. RUSTDOCFLAGS rather
      # than a `[lints]` entry, to make rustdoc's own lints errors workspace-wide.
      # `--document-private-items`: most of this tree is `pub(crate)`, so a
      # public-only pass would miss most of the rot. `--all-features`, unlike the
      # Clippy pass: a gated item's links are checked here or nowhere.
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  sandbox:
    # Arm is additive: `x32_gate` is `#[cfg(target_arch = "x86_64")]`, so arm
    # alone uncovers the x32 bypass. No floating arm label exists, so x86 floats
    # and arm is pinned. These names are the checks branch protection pins — a
    # rename blocks every merge on a status that will never report.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # A property of the runner image, not the architecture: Landlock needs
      # kernel ABI 5 (6.10+), and unprivileged userns is sysctl-disabled on some
      # hardened images.
      - name: Report kernel sandbox support
        run: |
          uname -rm
          echo "landlock LSM: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "unprivileged_userns_clone: $(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo unset)"
          echo "apparmor userns restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"

      # A zero-test result means the gating broke, not that there is nothing to
      # check.
      - name: Test (sandbox enforcement)
        run: cargo test --workspace --features sandbox-integration

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read from the manifest rather than pinned here, or the two drift.
      # `rust_version` from cargo metadata is the *inherited* value: a
      # `[workspace.package]` entry no member inherits is inert and reads as
      # null, which is the failure this job exists to rule out.
      - name: Read the floor out of the manifest
        id: floor
        run: |
          # `bash -e` without `pipefail`, so piping cargo into jq would take
          # jq's exit status. Assigning first lets `-e` fail on cargo's error.
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          floor="$(jq -r '
            [.packages[].rust_version] | unique
            | if length == 1 and .[0] != null then .[0] else "" end' <<<"$metadata")"
          if [ -z "$floor" ]; then
            echo "::error::every crate must inherit one rust-version from [workspace.package]"
            exit 1
          fi
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "floor=$floor"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.floor.outputs.floor }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Both feature sets the stable jobs cover between them, in one run.
      # `--locked` is the point of the job: Cargo.lock is what the release builds,
      # and resolver 3 *prefers* MSRV-compatible versions once `rust-version` is
      # stated, so an unlocked run would resolve its way around a lockfile that
      # cannot build at the floor at all, and pass.
      - name: Test at the stated floor
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration,sandbx-providers/mock

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # A plain command, not zizmor's own action: that would add a third-party
      # action to the surface this step checks, and need `security-events: write`.
      # Version pinned because a new release can add an audit, and dependabot
      # does not track this one. `GH_TOKEN` enables the audits that resolve a ref
      # upstream, `impostor-commit` above all.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 .
