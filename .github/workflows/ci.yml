name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories appear without a code change.
  schedule:
    - cron: "0 6 * * 1"

# Replaces the repo default, so a compromised action cannot push or publish.
# Nothing needs git credentials after the clone, hence `persist-credentials: false`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `v1`, not `stable`: the `stable` branch is regenerated as master plus one
      # commit, so a SHA pinned from it is reachable from no ref and never bumps.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # Byte-identical to `.githooks/pre-commit`; keep them so. Default features,
      # so production code reaching a test-only gated item fails here, not at tag time.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `--all-features` unlike Clippy: `required-features` binaries are documented here
      # or nowhere. `--document-private-items`: most of the tree is `pub(crate)`.
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  sandbox:
    # Arm is additive: `x32_gate` is `#[cfg(target_arch = "x86_64")]`, so arm alone
    # uncovers the x32 bypass. No floating arm label exists, so arm's runner is pinned.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    # Branch protection pins this name; a rename blocks every merge on a status
    # that will never report.
    name: sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `ring` arrives via `sandbx-anthropic` and its build.rs compiles C; the
      # `musl-dev` pulled in here is the `<arch>-linux-musl-gcc` cc-rs looks for.
      - name: Install the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # A runner-image property, not an architecture one: Landlock needs kernel
      # ABI 5 (6.10+), and unprivileged userns is sysctl-disabled on some hardened
      # images. `every_prose_copy_of_the_floor_is_current` greps this for "ABI 5".
      - name: Report kernel sandbox support
        run: |
          uname -rm
          echo "landlock LSM: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "unprivileged_userns_clone: $(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo unset)"
          echo "apparmor userns restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"

      - name: Test (sandbox enforcement)
        run: cargo test --workspace --features sandbox-integration

      # `--locked` unlike the gnu run, matching release.yml, so a musl break is
      # found at merge time; why both triples are run is in SECURITY.md.
      - name: Test (sandbox enforcement, the published musl triple)
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `rust_version` from cargo metadata is the *inherited* value: a
      # `[workspace.package]` entry no member inherits is inert and reads as null.
      - name: Read the floor out of the manifest
        id: floor
        run: |
          # Two statements, not one pipeline: the default shell is `bash -e` without
          # `pipefail`, so piping cargo into jq would take jq's exit status.
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          floor="$(jq -r '
            [.packages[].rust_version] | unique
            | if length == 1 and .[0] != null then .[0] else "" end' <<<"$metadata")"
          if [ -z "$floor" ]; then
            echo "::error::every crate must inherit one rust-version from [workspace.package]"
            exit 1
          fi
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "floor=$floor"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.floor.outputs.floor }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `--locked` is the point of the job: resolver 3 *prefers* MSRV-compatible
      # versions, so an unlocked run resolves around a broken lockfile and passes.
      - name: Test at the stated floor
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration

  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the notes for the version in the manifest
        run: |
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          version="$(jq -r '
            [.packages[].version] | unique
            | if length == 1 then .[0] else "" end' <<<"$metadata")"
          if [ -z "$version" ]; then
            echo "::error::every crate must inherit one version from [workspace.package]"
            exit 1
          fi
          .github/scripts/check-release-notes.sh "docs/release-notes/v$version.md"

      # The `v*` glob skips TEMPLATE.md, whose placeholder the script rejects.
      - name: Check every other release-notes file
        run: |
          found=0
          for f in docs/release-notes/v*.md; do
            [ -f "$f" ] || continue
            found=$((found + 1))
            .github/scripts/check-release-notes.sh "$f"
          done
          echo "checked $found"
          [ "$found" -gt 0 ] || { echo "::error::no docs/release-notes/v*.md"; exit 1; }

  # Required, but it does not judge a widening: it fails only when the baseline no
  # longer matches the surface. What it forbids is a widening with no line recording it.
  api-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The nightly is for rustdoc JSON only, which stable rustdoc refuses; the
      # build and every other job stay on stable. Pinned to the same date the
      # script defaults to — an unpinned `nightly` emits a new JSON format version
      # the day it lands and rewrites every baseline for no API change.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-09-11

      # `cache-bin` keeps `cargo-public-api` itself, so only the first run builds it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.52.0

      - name: Regenerate the public-API baseline
        run: .github/scripts/public-api.sh

      # Committed in two senses, and `git diff` only checks the second. A file that
      # was never added is invisible to it, so a new crate's baseline passed this
      # green with that crate's whole surface ungated (#402). `--others` is the half
      # the diff cannot see: it excludes the index, so `git add` clears it without a
      # commit, and after `actions/checkout` the index is HEAD anyway. No
      # `--exclude-standard` — an ignored baseline is as ungated as an untracked one.
      #
      # The `--others` check must stay after the regenerate step above: until the
      # script has run, a baseline nobody committed does not exist on disk at all and
      # it passes on an empty set. The two below read the index, so they hold wherever
      # they sit. The tracked list is also the zero-guard `guide-ci.md` asks of
      # anything that iterates — a pathspec matching nothing would pass silently,
      # which is how a mistyped pathspec or a run from the wrong directory reads.
      #
      # A stale baseline is the failure: the diff is printed so the fix is a copy
      # of what is already on screen, not a second run to find out what changed.
      - name: Check it against what is committed
        run: |
          untracked=$(git ls-files --others -- 'crates/*/public-api.txt')
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            echo "::error::the baseline above is not in the index, so its crate is ungated."
            echo "::error::git add it: a file that was never added is invisible to the diff."
            exit 1
          fi

          tracked=$(git ls-files -- 'crates/*/public-api.txt')
          if [ -z "$tracked" ]; then
            echo "::error::no crates/*/public-api.txt is tracked, so this job checked nothing."
            exit 1
          fi
          # The script keys on manifests, so a baseline whose crate is gone — renamed,
          # or deleted without it — is regenerated by nothing and diffs against
          # nothing. An `&&`-list here would fail under `set -e` and exit 1 with the
          # two annotations never printed, so the test is inverted into an `if`.
          while IFS= read -r f; do
            if [ ! -f "${f%/public-api.txt}/Cargo.toml" ]; then
              echo "::error::$f is committed but its crate has no Cargo.toml."
              echo "::error::Delete the baseline with the crate, or restore the crate."
              exit 1
            fi
          done <<< "$tracked"

          git diff --exit-code -- 'crates/*/public-api.txt' && exit 0
          echo "::error::the public API moved and crates/*/public-api.txt is stale."
          echo "::error::Run .github/scripts/public-api.sh, commit the result, and justify each widening in the PR."
          exit 1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before cargo-deny, which fails on any new advisory and would mask this.
      - name: Check the release channel table
        run: .github/scripts/release-channel.sh --self-test

      # Also before cargo-deny, and for a second reason beyond masking: this checks what
      # cargo-deny does not fail on. A `[[bans.deny]]` name matching no package is
      # vacuous rather than wrong, so a typo un-gates the crate it meant and still exits
      # 0 (#415). No toolchain step: `cargo metadata --no-deps` runs on the runner
      # image's cargo, as `msrv` and `notes` do for the reason *Ordering: `cargo
      # metadata` before any toolchain step* gives.
      #
      # The self-test runs first, against scratch workspaces, so a checker that has
      # stopped checking fails here rather than passing this file by default. `-I` for
      # the reason the top-level instruction gives about untrusted directories: it stops
      # the interpreter adding the script's own directory to `sys.path`.
      - name: Check the dependency allowlist against the graph
        run: |
          python3 -I .github/scripts/deny-wrappers.py --self-test
          python3 -I .github/scripts/deny-wrappers.py

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # Not zizmor's own action: that would add a third-party action to the surface
      # this step audits. Pinned because dependabot does not track it; `GH_TOKEN`
      # enables the audits that resolve a ref upstream, `impostor-commit` above all.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 .
