name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published continuously, so re-run the supply-chain check on a
  # schedule rather than only when the code happens to change.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege for GITHUB_TOKEN: declaring this replaces the broad repo
# default with exactly what is listed. No job writes, so a compromised
# third-party action cannot push commits or publish releases.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail rather than silently retry on a flaky registry.
  CARGO_NET_RETRY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Mirrors the pre-commit hook, so CI never disagrees with local tooling.
      # Deliberately default features: this is the pass that sees the crates as a
      # consumer does, so production code reaching for a test-only item behind a
      # feature (`sandbx-providers`' MockProvider) fails here rather than at tag
      # time in the release build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default suite plus every `mock` feature, whose tests are gated by
      # `required-features` so the pass above stays honest. Both have to be named:
      # `required-features` may only list the owning package's own features, so
      # `sandbx-agent` forwards to `sandbx-providers/mock` with a feature of its own,
      # and enabling only the provider's would leave the agent's turn-loop suite
      # silently unbuilt. Still excludes the sandbox-integration feature and any test
      # gated on live LLM credentials.
      - name: Test
        run: cargo test --workspace --features sandbx-providers/mock,sandbx-agent/mock

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The sandbox is the point of this project, so verify the runner can
      # actually enforce before trusting a green check. Landlock needs kernel
      # ABI 5 (6.10+); unprivileged userns is disabled by sysctl on some hardened images.
      - name: Report kernel sandbox support
        run: |
          uname -r
          echo "landlock LSM: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "unprivileged_userns_clone: $(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo unset)"
          echo "apparmor userns restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"

      # These tests assert that escapes are actually blocked, not merely that
      # the code compiles, and have been verified running for real on this
      # runner — a zero-test result here means the gating broke, not that there
      # is nothing to check.
      - name: Test (sandbox enforcement)
        run: cargo test --workspace --features sandbox-integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
