name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published continuously, so re-run the supply-chain check on a
  # schedule rather than only when the code happens to change.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege for GITHUB_TOKEN: declaring this replaces the broad repo
# default with exactly what is listed. No job writes, so a compromised
# third-party action cannot push commits or publish releases.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail rather than silently retry on a flaky registry.
  CARGO_NET_RETRY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Mirrors the pre-commit hook, so CI never disagrees with local tooling.
      # Deliberately default features: this is the pass that sees the crates as a
      # consumer does, so production code reaching for a test-only item behind a
      # feature (`sandbx-providers`' MockProvider) fails here rather than at tag
      # time in the release build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default suite plus `mock`, whose tests are gated by `required-features`
      # so the pass above stays honest. Still excludes the sandbox-integration
      # feature and any test gated on live LLM credentials.
      - name: Test
        run: cargo test --workspace --features sandbx-providers/mock

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The sandbox is the point of this project, so verify the runner can
      # actually enforce before trusting a green check. Landlock needs kernel
      # ABI 5 (6.10+); unprivileged userns is disabled by sysctl on some hardened images.
      - name: Report kernel sandbox support
        run: |
          uname -r
          echo "landlock LSM: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "unprivileged_userns_clone: $(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo unset)"
          echo "apparmor userns restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"

      # These tests assert that escapes are actually blocked, not merely that
      # the code compiles, and have been verified running for real on this
      # runner — a zero-test result here means the gating broke, not that there
      # is nothing to check.
      - name: Test (sandbox enforcement)
        run: cargo test --workspace --features sandbox-integration

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The floor is a claim the manifest makes, so read it from there rather than
      # pinning a version here: a second copy drifts the moment someone bumps
      # `rust-version`, and a job testing a version nobody claims proves nothing.
      #
      # `rust_version` from cargo metadata is the *inherited* value each crate
      # ends up with. That matters: a `[workspace.package]` entry no member
      # inherits is inert — cargo never checks it — and shows up here as a null,
      # which is the one failure mode this job exists to rule out.
      - name: Read the floor out of the manifest
        id: floor
        run: |
          floor="$(cargo metadata --format-version 1 --no-deps | jq -r '
            [.packages[].rust_version] | unique
            | if length == 1 and .[0] != null then .[0] else "" end')"
          if [ -z "$floor" ]; then
            echo "::error::every crate must inherit one rust-version from [workspace.package]"
            exit 1
          fi
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "floor=$floor"

      # @master, not @stable, because `with: toolchain` needs a ref that takes an
      # argument. Not a weaker pin: this action ships no version tags, so @stable
      # is a mutable branch too.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.floor }}

      - uses: Swatinem/rust-cache@v2

      # Both feature sets the stable jobs cover between them, in one run: the
      # `sandbox-integration` suite needs a Linux kernel with Landlock ABI 5
      # (6.10+), same as the `sandbox` job above, and `sandbx-providers/mock`
      # unlocks the test target gated on it by `required-features`.
      #
      # `--locked` is the point of the job, not a nicety. Cargo.lock is what the
      # release builds and what `cargo install --locked` uses, so it is the thing
      # with a floor. Worse, resolver 3 *prefers* MSRV-compatible versions once
      # `rust-version` is stated, so an unlocked run would resolve its way around
      # a lockfile that cannot build at the floor at all, and pass.
      - name: Test at the stated floor
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration,sandbx-providers/mock

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
