name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published continuously, so re-run the supply-chain check on a
  # schedule rather than only when the code happens to change.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege for GITHUB_TOKEN: declaring this replaces the broad repo
# default with exactly what is listed. No job writes, so a compromised
# third-party action cannot push commits or publish releases. Nothing here needs
# git credentials after the clone either, so every checkout drops the token
# rather than leaving it in `.git/config` for a later step to find.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail rather than silently retry on a flaky registry.
  CARGO_NET_RETRY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `v1`, not `stable`: `v1` tags master's head, while the `stable` branch is
      # regenerated as master plus one commit, so a SHA from it is reachable from
      # no ref the next time master moves — and dependabot bumps a SHA pin whose
      # tag has moved by resolving the branch containing it, so an orphaned
      # `stable` commit would never be bumped at all. Master leaves `toolchain`
      # required, so every call site names its channel.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # Mirrors the pre-commit hook, so CI never disagrees with local tooling.
      # Deliberately default features: this is the pass that sees the crates as a
      # consumer does, so production code reaching for a test-only item behind a
      # feature (`sandbx-providers`' MockProvider) fails here rather than at tag
      # time in the release build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Default suite plus `mock`, whose tests are gated by `required-features`
      # so the pass above stays honest. Still excludes the sandbox-integration
      # feature and any test gated on live LLM credentials.
      - name: Test
        run: cargo test --workspace --features sandbx-providers/mock

      # Intra-doc links are load-bearing here: the `context/guide-*.md` files
      # explain the design, and the doc comments carry the detail those guides
      # point at. A link that silently stops resolving takes a reader to nothing.
      # Nothing caught that until now, and four had already rotted — all four
      # from a `pub` item naming something private, which is the failure mode a
      # visibility change introduces without touching the comment.
      #
      # `--document-private-items`, so the internal links are checked too. Most
      # of this tree is `pub(crate)`/`pub(super)`, so the public-only pass sees a
      # minority of the comments and would miss the majority of the rot.
      #
      # `--all-features`, unlike the Clippy pass above, which is deliberately
      # default-features to see the crates as a consumer does. The reasoning does
      # not carry over: a feature-gated item's doc links are either checked here
      # or nowhere, and there is no release-build equivalent to catch them later.
      #
      # `-D warnings` via RUSTDOCFLAGS rather than a `[lints]` entry: this turns
      # rustdoc's own lints (`broken_intra_doc_links`, `private_intra_doc_links`)
      # into errors for the whole workspace at once, and keeps the gate next to
      # the command that runs it.
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  sandbox:
    # Arm is additive, not a move: `x32_gate` and its tests are
    # `#[cfg(target_arch = "x86_64")]`, so arm alone uncovers the x32 bypass.
    # No floating arm label exists, so x86 floats and arm is pinned; the legs are
    # not always the same OS generation.
    # Named by architecture because these are the check names branch protection
    # pins: a label swap renames the check, and the old name then blocks every
    # merge, waiting for a status that will never report.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    name: sandbox (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The sandbox is the point of this project, so verify the runner can
      # actually enforce before trusting a green check. A property of the runner
      # image, not the architecture: Landlock needs kernel ABI 5 (6.10+), and
      # unprivileged userns is disabled by sysctl on some hardened images.
      - name: Report kernel sandbox support
        run: |
          uname -rm
          echo "landlock LSM: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "unprivileged_userns_clone: $(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || echo unset)"
          echo "apparmor userns restriction: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"

      # These tests assert that escapes are actually blocked, not merely that
      # the code compiles, and have been verified running for real on both
      # runners — a zero-test result here means the gating broke, not that there
      # is nothing to check.
      - name: Test (sandbox enforcement)
        run: cargo test --workspace --features sandbox-integration

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The floor is a claim the manifest makes, so read it from there rather than
      # pinning a version here: a second copy drifts the moment someone bumps
      # `rust-version`, and a job testing a version nobody claims proves nothing.
      #
      # `rust_version` from cargo metadata is the *inherited* value each crate
      # ends up with. That matters: a `[workspace.package]` entry no member
      # inherits is inert — cargo never checks it — and shows up here as a null,
      # which is the one failure mode this job exists to rule out.
      - name: Read the floor out of the manifest
        id: floor
        run: |
          # Two statements rather than one pipeline: the default shell is
          # `bash -e` without `pipefail`, so piping cargo into jq would take
          # jq's exit status and report a manifest that does not *parse* as one
          # that is missing a floor — sending the reader to the wrong file.
          # Assigning first lets `-e` fail the step on cargo's own error.
          metadata="$(cargo metadata --format-version 1 --no-deps)"
          floor="$(jq -r '
            [.packages[].rust_version] | unique
            | if length == 1 and .[0] != null then .[0] else "" end' <<<"$metadata")"
          if [ -z "$floor" ]; then
            echo "::error::every crate must inherit one rust-version from [workspace.package]"
            exit 1
          fi
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "floor=$floor"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.floor.outputs.floor }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Both feature sets the stable jobs cover between them, in one run: the
      # `sandbox-integration` suite needs a Linux kernel with Landlock ABI 5
      # (6.10+), same as the `sandbox` job above, and `sandbx-providers/mock`
      # unlocks the test target gated on it by `required-features`.
      #
      # `--locked` is the point of the job, not a nicety. Cargo.lock is what the
      # release builds and what `cargo install --locked` uses, so it is the thing
      # with a floor. Worse, resolver 3 *prefers* MSRV-compatible versions once
      # `rust-version` is stated, so an unlocked run would resolve its way around
      # a lockfile that cannot build at the floor at all, and pass.
      - name: Test at the stated floor
        run: |
          cargo test --workspace --locked \
            --features sandbox-integration,sandbx-providers/mock

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      # The pins above are only as good as the next person's habit, so a loose
      # ref added later fails here instead of rotting unnoticed. Runs as a plain
      # command rather than zizmor's own action, which would add a third-party
      # action to the surface this step exists to check, and need
      # `security-events: write` to upload SARIF.
      #
      # The exact version is pinned for the reason the actions are: a new release
      # can add an audit, and a gate that starts failing on its own schedule gets
      # disabled rather than read. Dependabot does not track this one.
      #
      # `GH_TOKEN` is what enables the audits that resolve a ref against the
      # upstream repo — `impostor-commit` above all, which is the one that catches
      # a SHA that never belonged to the action it is written beside.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 .
