# Rewrites both the SHA pin and the `# vX.Y.Z` comment beside it, so nothing may
# follow that comment on the line — a version it cannot match is left stale.

version: 2
updates:
  - package-ecosystem: github-actions
    # Must be `/` for this ecosystem; `.github/workflows` is found from there.
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Dependabot commits through the API, so .githooks/commit-msg never sees them;
    # the prefix is what keeps a squash merge's subject conventional.
    commit-message:
      prefix: ci
    labels:
      - ci
    # Reaching the limit stops new PRs without saying so.
    open-pull-requests-limit: 10
    # A compromised release is usually yanked within days. `default-days` is the
    # only cooldown key this ecosystem reads; the `semver-*-days` ones are inert.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
