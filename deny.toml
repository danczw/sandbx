[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Copyleft (GPL/AGPL) would impose obligations on anything linking sandbx.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# CDLA-Permissive-2.0 is a permissive *data* license, covering only this crate's
# bundled Mozilla CA roots. An exception, not an `allow`, so the next crate
# arriving under it is considered on its own.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Warn, not deny: a duplicate means two copies of any vulnerability, but
# transitive deps often force one.
multiple-versions = "warn"
# Workspace crates carry no version, so a path dependency is a wildcard by
# construction — the only place one is allowed.
wildcards = "deny"
allow-wildcard-paths = true

# Which workspace crate may depend on which (#329). `wrappers` reads the whole
# dependency graph, so a path dependency counts: adding an edge that is not listed
# here fails `bans` with the unmatched parent named. Dev-dependencies are edges too.
#
# `sandbx-cli` and `sandbx-helper` are deliberately absent. Nothing depends on either,
# and an entry with an empty `wrappers` bans a crate outright rather than permitting
# nothing — so the rule "nothing may depend on this" is unexpressed, and a first
# dependency on it would pass. Every crate that *is* depended on is listed, including the
# leaves, or omission reads as permission.
[[bans.deny]]
name = "sandbx-core"
# `sandbx-agent`'s edge is a dev-dependency: `sandbx-core` is not in its build.
# `sandbx-helper`'s is not — the binary is what the enforcement suite spawns, so it
# links core for real.
wrappers = ["sandbx-agent", "sandbx-cli", "sandbx-helper", "sandbx-logging", "sandbx-tools"]

[[bans.deny]]
name = "sandbx-providers"
wrappers = [
    "sandbx-agent",
    "sandbx-cli",
    "sandbx-compact",
    "sandbx-session-bridge",
    "sandbx-tui-transcript",
]

[[bans.deny]]
name = "sandbx-tools"
wrappers = ["sandbx-agent", "sandbx-approval", "sandbx-cli"]

[[bans.deny]]
name = "sandbx-agent"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-auth"
# Not `sandbx-grants`, which does not exist until #350 adds itself here — it reaches
# `config_file` to refuse a grant covering the credential file.
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-logging"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-session-message"
# `sandbx-session-bridge` is the translation between these shapes and the provider's, so
# its edge is the one #359 described. `sandbx-cli`'s is direct too and survives the split
# — `agent/run.rs` names `CompletedTurn` to append a finished turn — and neither is
# inherited through `sandbx-session` (#351).
wrappers = ["sandbx-cli", "sandbx-session", "sandbx-session-bridge"]

[[bans.deny]]
name = "sandbx-session"
# `sandbx-session-bridge`'s edge is the temporary whole-crate one, which #360, #361 and
# #362 replace with the three narrow ones it actually reaches (#351).
wrappers = ["sandbx-cli", "sandbx-session-bridge"]

[[bans.deny]]
name = "sandbx-tui-input"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-screen"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-tui-transcript"
# One parent, not three: `sandbx-cli` reaches `Transcript` through `sandbx-screen`'s
# re-export, and `sandbx-tui-input` has no edge here at all (#352, #354).
wrappers = ["sandbx-screen"]

[[bans.deny]]
name = "sandbx-pty-fixture"
# A dev-dependency edge, so this crate is in nobody's build; the entry is what keeps a
# production edge from being added without a line here. Two parents, each driving a pty:
# the screen for a hangup, and the keys for a reader.
wrappers = ["sandbx-screen", "sandbx-tui-input"]

[[bans.deny]]
name = "sandbx-text"
wrappers = ["sandbx-cli", "sandbx-tui-transcript"]

[[bans.deny]]
name = "sandbx-approval"
# Not `sandbx-turn`, which does not exist until #357 takes over `sandbx-agent`'s place here.
wrappers = ["sandbx-agent", "sandbx-cli"]

[[bans.deny]]
name = "sandbx-session-error"
# `sandbx-cli`'s edge is direct and not inherited through `sandbx-session`: it matches
# the variants and converts them to an `AgentError`. Three more parents are coming, this
# crate being the bottom of the session tree, and each *appends* its name here rather
# than replacing one: #360 `sandbx-session-id`, #361 `sandbx-session-paths`,
# #362 `sandbx-session-store`.
wrappers = ["sandbx-cli", "sandbx-session", "sandbx-session-bridge"]

[[bans.deny]]
name = "sandbx-compact"
# `sandbx-turn` takes `sandbx-agent`'s place here when #357 splits the loop out.
# `sandbx-session-bridge` names `PromptUsage` through an edge of its own and not
# `sandbx-agent`'s re-export, which is the shape #351 landed (not the one it predicted).
wrappers = ["sandbx-agent", "sandbx-session-bridge"]

[[bans.deny]]
name = "sandbx-session-bridge"
wrappers = ["sandbx-cli"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
