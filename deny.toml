[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Copyleft (GPL/AGPL) would impose obligations on anything linking sandbx.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# CDLA-Permissive-2.0 is a permissive *data* license, covering only this crate's
# bundled Mozilla CA roots. An exception, not an `allow`, so the next crate
# arriving under it is considered on its own.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Warn, not deny: a duplicate means two copies of any vulnerability, but
# transitive deps often force one.
multiple-versions = "warn"
# Workspace crates carry no version, so a path dependency is a wildcard by
# construction — the only place one is allowed.
wildcards = "deny"
allow-wildcard-paths = true

# Which workspace crate may depend on which (#329). `wrappers` reads the whole
# dependency graph, so a path dependency counts: adding an edge that is not listed
# here fails `bans` with the unmatched parent named. Dev-dependencies are edges too.
#
# `sandbx-cli` and `sandbx-helper` are deliberately absent. Nothing depends on either,
# and an entry with an empty `wrappers` bans a crate outright rather than permitting
# nothing — so the rule "nothing may depend on this" is unexpressed *here*. It is not
# unenforced: `deny-wrappers.py` fails when a crate something depends on has no block,
# so a first dependency on either of those two fails that check rather than this file
# (#415). Every crate that *is* depended on is listed, including the leaves.
#
# Three more things this file cannot say and the script checks, all measured rather than
# assumed: a `name` matching no package is vacuous, so a typo un-gates the crate it meant
# while `cargo deny check bans` still exits 0; a `wrappers` array naming a parent with no
# edge is only `warning[unused-wrapper]`, so it passes while overstating who may depend
# on the crate; and a version pin or a `[graph]` exclusion empties cargo-deny's own view
# of these edges the same way, which is why neither may be added here (#415).
[[bans.deny]]
name = "sandbx-core"
# `sandbx-turn`'s edge is a dev-dependency: `sandbx-core` is not in its build.
# `sandbx-helper`'s is not — the binary is what the enforcement suite spawns, so it
# links core for real.
#
# One name per line from here: a sixth parent puts this past the width every other line in
# the file keeps.
wrappers = [
    "sandbx-cli",
    "sandbx-grants",
    "sandbx-helper",
    "sandbx-logging",
    "sandbx-tools",
    "sandbx-turn",
]

[[bans.deny]]
name = "sandbx-providers"
wrappers = [
    "sandbx-cli",
    "sandbx-compact",
    "sandbx-session-bridge",
    "sandbx-tui-transcript",
    "sandbx-turn",
]

[[bans.deny]]
name = "sandbx-tools"
wrappers = ["sandbx-approval", "sandbx-cli", "sandbx-turn"]

[[bans.deny]]
name = "sandbx-turn"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-auth"
# `sandbx-grants` reaches `config_file` to refuse a grant covering the credential file;
# `sandbx-cli`'s edge is its own, for the key the `auth` subcommand reads (#350).
wrappers = ["sandbx-cli", "sandbx-grants"]

[[bans.deny]]
name = "sandbx-logging"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-session-message"
# Neither `sandbx-session-bridge`'s edge nor `sandbx-cli`'s is inherited through
# `sandbx-session-store`: the bridge is the translation #359 described, and `agent/run.rs`
# names `CompletedTurn` to append a finished turn (#351).
wrappers = ["sandbx-cli", "sandbx-session-bridge", "sandbx-session-store"]

[[bans.deny]]
name = "sandbx-session-store"
# Two names are the whole crate now, so neither edge is wide: `sandbx-session-bridge` opens
# a store and reads a transcript back, and `agent/run.rs` appends a finished turn to the
# `Session` it holds (#350, #351, #362).
wrappers = ["sandbx-cli", "sandbx-session-bridge"]

[[bans.deny]]
name = "sandbx-tui-input"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-screen"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-tui-transcript"
# One parent, not three: `sandbx-cli` reaches `Transcript` through `sandbx-screen`'s
# re-export, and `sandbx-tui-input` has no edge here at all (#352, #354).
wrappers = ["sandbx-screen"]

[[bans.deny]]
name = "sandbx-pty-fixture"
# A dev-dependency edge, so this crate is in nobody's build; the entry is what keeps a
# production edge from being added without a line here. Two parents, each driving a pty:
# the screen for a hangup, and the keys for a reader.
wrappers = ["sandbx-screen", "sandbx-tui-input"]

[[bans.deny]]
name = "sandbx-text"
wrappers = ["sandbx-cli", "sandbx-tui-transcript"]

[[bans.deny]]
name = "sandbx-approval"
wrappers = ["sandbx-cli", "sandbx-turn"]

[[bans.deny]]
name = "sandbx-session-error"
# `sandbx-cli`'s edge is direct and not inherited through `sandbx-session-store`: it matches
# the variants and converts them to an `AgentError`. `sandbx-session-bridge`'s is direct
# too: `open` returns a `SessionError` rather than wrapping one (#351). The bottom of the
# session tree, so every crate above it is here and the list is now closed (#362).
wrappers = [
    "sandbx-cli",
    "sandbx-session-bridge",
    "sandbx-session-id",
    "sandbx-session-paths",
    "sandbx-session-store",
]

[[bans.deny]]
name = "sandbx-session-id"
# `sandbx-session-store` is here for `clock_millis` and for the two signatures that name a
# `SessionId`, having taken that edge over with `session.rs` (#362). The other two are direct
# and not inherited through it: `sandbx-session-bridge` names `SessionId` in `SessionChoice`,
# and `sandbx-cli` parses one off argv (#360).
wrappers = ["sandbx-cli", "sandbx-session-bridge", "sandbx-session-store"]

[[bans.deny]]
name = "sandbx-session-paths"
# Neither parent inherits this through `sandbx-session-store`, which has no edge here:
# `sandbx-grants` names `sessions_directory` to refuse a grant covering the transcript
# directory, and `sandbx-session-bridge` names it to build the store from the real
# environment. `sandbx-cli` is absent — it names `Session`, `SessionStore` and `SessionId`,
# never this (#361).
wrappers = ["sandbx-grants", "sandbx-session-bridge"]

[[bans.deny]]
name = "sandbx-compact"
# `sandbx-session-bridge` names `PromptUsage` through an edge of its own and not
# `sandbx-turn`'s re-export (#351).
wrappers = ["sandbx-session-bridge", "sandbx-turn"]

[[bans.deny]]
name = "sandbx-session-bridge"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-grants"
# One parent, and it stays one: every subcommand that confines something flattens `Grants`,
# and all of them are `sandbx-cli`'s (#350).
wrappers = ["sandbx-cli"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
