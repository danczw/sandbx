[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Copyleft (GPL/AGPL) would impose obligations on anything linking sandbx.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# CDLA-Permissive-2.0 is a permissive *data* license, covering only this crate's
# bundled Mozilla CA roots. An exception, not an `allow`, so the next crate
# arriving under it is considered on its own.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Warn, not deny: a duplicate means two copies of any vulnerability, but
# transitive deps often force one.
multiple-versions = "warn"
# Workspace crates carry no version, so a path dependency is a wildcard by
# construction — the only place one is allowed.
wildcards = "deny"
allow-wildcard-paths = true

# Which workspace crate may depend on which (#329). `wrappers` reads the whole
# dependency graph, so a path dependency counts: adding an edge that is not listed
# here fails `bans` with the unmatched parent named. Dev-dependencies are edges too.
#
# `sandbx-cli` is deliberately absent. Nothing depends on it, and an entry with an
# empty `wrappers` bans a crate outright rather than permitting nothing — so the rule
# "nothing may depend on `sandbx-cli`" is unexpressed, and a first dependency on it
# would pass. Every other crate is listed, including the leaves, or omission reads as
# permission.
[[bans.deny]]
name = "sandbx-core"
# `sandbx-agent`'s edge is a dev-dependency: `sandbx-core` is not in its build.
wrappers = ["sandbx-agent", "sandbx-cli", "sandbx-tools"]

[[bans.deny]]
name = "sandbx-providers"
wrappers = ["sandbx-agent", "sandbx-cli", "sandbx-tui"]

[[bans.deny]]
name = "sandbx-tools"
wrappers = ["sandbx-agent", "sandbx-cli"]

[[bans.deny]]
name = "sandbx-agent"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-session"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-tui"
wrappers = ["sandbx-cli"]

[[bans.deny]]
name = "sandbx-pty-fixture"
# A dev-dependency edge, so this crate is in nobody's build; listing it is still what
# keeps a production one from being added without a line here.
wrappers = ["sandbx-tui"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
