# cargo-deny configuration — run via `cargo deny check` (CI job + on demand).
# Covers supply-chain advisories, licensing, and dependency hygiene in one tool,
# which is why a separate `cargo audit` step is not used.

[advisories]
# Fail on any crate with a known security advisory.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. Copyleft (GPL/AGPL) would impose obligations on
# anything linking sandbx; flag it rather than discover it at release time.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Duplicate versions of the same crate bloat the binary and mean two copies of
# any vulnerability. Warn rather than deny: transitive deps often force these.
multiple-versions = "warn"
# A wildcard version is a supply-chain hazard: `foo = "*"` accepts whatever the
# registry serves. That reasoning does not apply to a path dependency, which
# resolves to a directory in this repo and cannot be substituted by a registry.
# Workspace crates carry no version for that reason, so allow the wildcard
# exactly where it is one by construction, and keep denying it everywhere else.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternate-registry dependency sneaking in is a
# supply-chain red flag worth failing the build over.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
