[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Copyleft (GPL/AGPL) would impose obligations on anything linking sandbx.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# CDLA-Permissive-2.0 is a permissive *data* license, covering only this crate's
# bundled Mozilla CA roots. An exception, not an `allow`, so the next crate
# arriving under it is considered on its own.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Warn, not deny: a duplicate means two copies of any vulnerability, but
# transitive deps often force one.
multiple-versions = "warn"
# Workspace crates carry no version, so a path dependency is a wildcard by
# construction — the only place one is allowed.
wildcards = "deny"
allow-wildcard-paths = true

# Which workspace crate may depend on which: each crate another one depends on is
# banned except as a dependency of its `wrappers`, dev-dependencies included. A crate
# with no entry may be depended on by anything, so .github/scripts/check-crate-bans.sh
# fails on one. A crate nothing may depend on (`sandbx-cli`) takes no entry: an empty
# `wrappers` bans the crate outright, itself included.

# The only crate allowed to spawn; a new dependent reaches the sandbox's internals.
[[bans.deny]]
crate = "sandbx-core"
wrappers = ["sandbx-tools", "sandbx-agent", "sandbx-cli"]

[[bans.deny]]
crate = "sandbx-providers"
wrappers = ["sandbx-agent", "sandbx-tui", "sandbx-cli"]

[[bans.deny]]
crate = "sandbx-tools"
wrappers = ["sandbx-agent", "sandbx-cli"]

[[bans.deny]]
crate = "sandbx-agent"
wrappers = ["sandbx-cli"]

[[bans.deny]]
crate = "sandbx-session"
wrappers = ["sandbx-cli"]

[[bans.deny]]
crate = "sandbx-tui"
wrappers = ["sandbx-cli"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
