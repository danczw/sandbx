[package]
name = "sandbx-turn-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# What a scripted turn is made of. Real dependencies, not dev-dependencies — this crate
# is the fixture, so a dev-dependency of its own would not reach it.
sandbx-approval = { path = "../sandbx-approval" }
sandbx-core = { path = "../sandbx-core" }
sandbx-event = { path = "../sandbx-event" }
sandbx-prompt = { path = "../sandbx-prompt" }
sandbx-provider = { path = "../sandbx-provider" }
sandbx-tools = { path = "../sandbx-tools" }
# The crate under test. `sandbx-turn` dev-depends on this one, and why that cycle is
# sound is in `src/lib.rs`'s `//!`. Only `turn` needs the edge, for the `Turn` literal.
#
# **Never add `features` to this line.** Resolver 3 unifies features per package, so a
# feature asked for here travels the two hops back — turn → fixture → turn — and lands on
# the one rlib every consumer links. That is `guide-ci.md`'s self-dev-dependency hazard
# with a crate in the middle, and CI has no release-build job to fail on it.
sandbx-turn = { path = "../sandbx-turn" }
# Both at the versions `sandbx-turn` already pins, so cargo-deny's duplicate check stays
# quiet: one resolved version each across the workspace.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = "1.0.151"

[lints]
workspace = true
