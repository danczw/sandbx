[package]
name = "sandbx-turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sandbx-approval = { path = "../sandbx-approval" }
sandbx-compact = { path = "../sandbx-compact" }
sandbx-event = { path = "../sandbx-event" }
sandbx-prompt = { path = "../sandbx-prompt" }
sandbx-providers = { path = "../sandbx-providers" }
sandbx-tools = { path = "../sandbx-tools" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Not `rt-multi-thread`: the runtime flavour is the binary's call. `time` is not
# optional — `run_turn` panics on the first round without a timer.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "macros", "test-util"] }
# Dev-only since `compact_tests.rs` left for `sandbx-compact`: nothing under `src/`
# names it, and the four files under `tests/` build the inputs a scripted turn asks for.
serde_json = "1.0.151"
sandbx-core = { path = "../sandbx-core" }
tempfile = "3.27.0"
# To read the trail a scripted turn leaves, never to write one: `tracing` is a
# dependency of `sandbx-core` alone, and this crate holds no emission site.
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
