[package]
name = "sandbx-turn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sandbx-approval = { path = "../sandbx-approval" }
sandbx-compact = { path = "../sandbx-compact" }
sandbx-event = { path = "../sandbx-event" }
sandbx-prompt = { path = "../sandbx-prompt" }
sandbx-provider = { path = "../sandbx-provider" }
sandbx-tools = { path = "../sandbx-tools" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Not `rt-multi-thread`: the runtime flavour is the binary's call. `time` is not
# optional — `run_turn` panics on the first round without a timer.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }

[features]
# Spends money per run against a paid `ANTHROPIC_API_KEY`, as `sandbx-anthropic`'s feature
# of the same name does. Its own and not forwarded: a feature cannot name a dev-dependency.
live-anthropic-tests = []

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "macros", "test-util"] }
# Dev-only: nothing under `src/` names it; the files under `tests/` build the inputs a
# scripted turn asks for.
serde_json = "1.0.151"
sandbx-core = { path = "../sandbx-core" }
# A crate rather than a `tests/support/mod.rs` for the reasons its own `//!` gives. The
# cycle — it depends on this crate — never exists in the unit graph: these *test* targets
# link it, and it links this *lib*.
sandbx-turn-fixture = { path = "../sandbx-turn-fixture" }
# Dev-only: nothing under `src/` names this crate; the one reference is `turn_loop.rs`'s
# spawnability pin, which types a field as an `AnthropicClient`.
sandbx-anthropic = { path = "../sandbx-anthropic" }
# Dev-only: the key `live_compaction.rs` sends with, resolved as `agent-run` resolves it.
sandbx-auth = { path = "../sandbx-auth" }
tempfile = "3.27.0"
# To read the trail a scripted turn leaves, never to write one: `tracing` is a
# dependency of `sandbx-core` alone, and this crate holds no emission site.
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
