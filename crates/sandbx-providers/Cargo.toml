[package]
name = "sandbx-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `rustls-no-provider`, not `rustls`: the latter auto-picks aws-lc-rs, which
# vendors and compiles C and assembly. The provider is chosen below instead.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json", "system-proxy"] }
# Direct dependency only so the `ring` provider is selected; with no provider
# enabled anywhere, building a `ClientConfig` fails at runtime, not at compile
# time.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The vocabulary a stream yields: `EventStream` names `AgentEvent`, and `accumulate.rs`
# builds one per frame (#365).
sandbx-event = { path = "../sandbx-event" }
# What a request is made of. `anthropic/` and the two client tests are the whole edge,
# and `body.rs` is the only writer of one (#364).
sandbx-prompt = { path = "../sandbx-prompt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
secrecy = "0.10.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }
wiremock = "0.6.5"

[features]
# Spends money per run against a paid `ANTHROPIC_API_KEY`. A feature rather than
# a runtime check so running without opting in fails to compile.
live-anthropic-tests = []

[lints]
workspace = true
