[package]
name = "sandbx-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `rustls-no-provider`, not `rustls`: the latter auto-picks aws-lc-rs, which
# vendors and compiles C and assembly. The provider is chosen below instead.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "json", "system-proxy"] }
# Direct dependency only so the `ring` provider is selected; with no provider
# enabled anywhere, building a `ClientConfig` fails at runtime, not at compile
# time.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
secrecy = "0.10.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
bytes = "1"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }
wiremock = "0.6.5"

# Declared as a target rather than via a self dev-dependency on `features =
# ["mock"]`: resolver v3 unifies features per package, so that edge would turn
# `mock` on in the one rlib every consumer links, and production code touching
# `MockProvider` would pass clippy and the test suite before failing the release
# build.
[[test]]
name = "mock_provider"
required-features = ["mock"]

[features]
# Spends money per run against a paid `ANTHROPIC_API_KEY`. A feature rather than
# a runtime check so running without opting in fails to compile.
live-anthropic-tests = []
mock = []

[lints]
workspace = true
