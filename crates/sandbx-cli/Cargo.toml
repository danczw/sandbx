[package]
name = "sandbx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The crate is `sandbx-cli` to keep the workspace naming consistent, but the
# shipped command users type is `sandbx`.
[lib]
name = "sandbx_cli"
path = "src/lib.rs"

[[bin]]
name = "sandbx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
sandbx-core = { path = "../sandbx-core" }

[lints]
workspace = true
