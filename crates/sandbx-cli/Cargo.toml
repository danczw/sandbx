[package]
name = "sandbx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sandbx_cli"
path = "src/lib.rs"

[[bin]]
name = "sandbx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
sandbx-agent = { path = "../sandbx-agent" }
sandbx-core = { path = "../sandbx-core" }
sandbx-providers = { path = "../sandbx-providers" }
sandbx-session = { path = "../sandbx-session" }
sandbx-tools = { path = "../sandbx-tools" }
# Not `rt-multi-thread`: `spawn_blocking` needs only `rt`. `time` is not optional
# — `run_turn` panics on the first round without a timer. Nothing here enables
# `process`, which is why clippy.toml's `tokio::process` entry stays inert.
tokio = { version = "1.53.1", default-features = false, features = [
  "net",
  "rt",
  "time",
] }
# `tracing` discards every event when no subscriber is installed, and a library
# cannot install one; this crate owns the workspace's only subscriber.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
] }
# `sandbx-providers` does not re-export `secrecy`; keep this at the version it
# resolves, or `AnthropicClient::new` takes a different `SecretString`.
secrecy = "0.10.3"
toml = { version = "1.1.6", default-features = false, features = [
  "parse",
  "display",
  "serde",
] }
tempfile = "3.27.0"

[dev-dependencies]
tracing = "0.1.44"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = "1.0.151"

[lints]
workspace = true
