[package]
name = "sandbx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "sandbx_cli"
path = "src/lib.rs"

[[bin]]
name = "sandbx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
# `term` alone: the one call is `tcflush`, discarding a consent answer typed before the
# question that would have claimed it.
nix = { version = "0.31.3", default-features = false, features = ["term"] }
sandbx-turn = { path = "../sandbx-turn" }
sandbx-approval = { path = "../sandbx-approval" }
sandbx-auth = { path = "../sandbx-auth" }
sandbx-core = { path = "../sandbx-core" }
sandbx-grants = { path = "../sandbx-grants" }
sandbx-logging = { path = "../sandbx-logging" }
sandbx-providers = { path = "../sandbx-providers" }
sandbx-screen = { path = "../sandbx-screen" }
sandbx-session = { path = "../sandbx-session" }
sandbx-session-bridge = { path = "../sandbx-session-bridge" }
sandbx-session-error = { path = "../sandbx-session-error" }
sandbx-session-id = { path = "../sandbx-session-id" }
sandbx-session-message = { path = "../sandbx-session-message" }
sandbx-text = { path = "../sandbx-text" }
sandbx-tools = { path = "../sandbx-tools" }
sandbx-tui-input = { path = "../sandbx-tui-input" }
# `macros` is `select!`, which races the turn against the key that interrupts it.
# Not `rt-multi-thread`: `spawn_blocking` needs only `rt`. `time` is not optional
# — `run_turn` panics on the first round without a timer. Nothing here enables
# `process`, which is why clippy.toml's `tokio::process` entry stays inert.
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "net",
  "rt",
  "time",
] }
# A tool call's arguments arrive as `serde_json::Value`, and the gate reads a subject out
# of them to report; the version must match whatever `sandbx-turn` resolves.
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
# `poll` on top of the production `term`: the typeahead drain is tested over a real pty,
# and the pair has to be known readable before the drain runs or the test asserts nothing.
nix = { version = "0.31.3", default-features = false, features = ["term", "poll"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[lints]
workspace = true
