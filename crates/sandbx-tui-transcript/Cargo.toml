[package]
name = "sandbx-tui-transcript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# No backend: the terminal is `sandbx-screen`'s and a frame is all this crate is
# handed, so `crossterm` belongs there and not here.
# `unstable-rendered-line-info` is `Paragraph::line_count`, which measures text
# after wrapping — the alternative is a second word-wrapper that has to agree
# with ratatui's to the row. Pinned exactly, the API being unstable by that name.
ratatui = { version = "=0.30.2", default-features = false, features = [
  "unstable-rendered-line-info",
] }
# For `AgentEvent` and `StopReason` alone, and it carries the whole client tree
# #328 exists to shed: the edge leaves when `sandbx-event` (#365) lands.
sandbx-providers = { path = "../sandbx-providers" }
sandbx-text = { path = "../sandbx-text" }

[dev-dependencies]
serde_json = "1.0.145"

[lints]
workspace = true
