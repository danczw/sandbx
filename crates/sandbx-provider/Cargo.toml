[package]
name = "sandbx-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# What a stream yields: the alias's `Item` is a `Result<AgentEvent, ProviderError>`.
sandbx-event = { path = "../sandbx-event" }
# `FusedStream`, the bound on the boxed stream. The trait is `futures-core`'s, which is
# what the baseline renders, so this looks like it should be the narrower edge. It is not
# worth narrowing: `sandbx-anthropic`, `sandbx-sse`, `sandbx-turn` and `sandbx-cli` each
# declare `futures-util` anyway, so it sheds nothing from any build that exists. Revisit
# only if this crate becomes a dependency of something light.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[lints]
workspace = true
