[package]
name = "sandbx-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `Transport::source` alone, and it is a public field, so the seam carries the client
# chain whatever it does with it. `default-features = false` and no TLS or transport
# feature: this crate opens no connection, and the bare form would select
# `default-tls` and compile native-tls. `sandbx-providers` picks the provider (#366).
reqwest = { version = "0.13.5", default-features = false }
# What a stream yields: the alias's `Item` is a `Result<AgentEvent, ProviderError>`.
sandbx-event = { path = "../sandbx-event" }
# `FusedStream`, the bound on the boxed stream.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[lints]
workspace = true
