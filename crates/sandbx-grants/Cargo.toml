[package]
name = "sandbx-grants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
sandbx-auth = { path = "../sandbx-auth" }
sandbx-core = { path = "../sandbx-core" }
# `sessions_directory` alone, to refuse a grant covering the transcript directory. Nothing
# here reaches the store that writes into it.
sandbx-session-paths = { path = "../sandbx-session-paths" }

[lints]
workspace = true

[dev-dependencies]
# A refusal is asserted against a real directory tree, symlinks included, so the
# cases that turn on canonicalization are not mocked below the thing they test.
tempfile = "3.27.0"
