[package]
name = "sandbx-screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# No default features: `all-widgets`, `macros` and `underline-color` buy nothing
# here. `crossterm` is the backend `Measured` wraps.
#
# This pin and `sandbx-tui-input`'s must move together, and nothing enforces it: the
# reader lock `Keys` holds and the raw-mode flag `try_restore` reads are crossterm
# *globals*, so two resolved crossterms give two of each and the exclusion
# `Screen::finish` relies on stops holding. `deny.toml` has
# `multiple-versions = "warn"`, so that divergence does not fail the build (#352).
ratatui = { version = "=0.30.2", default-features = false, features = [
  "crossterm",
] }
# `termios` alone, for `tcgetwinsize`: the screen measures its own window, crossterm's
# `terminal::size` forking `tput` when the measurement fails (#269). nix has no safe
# `TIOCGWINSZ`, and this is the rustix crossterm already builds.
rustix = { version = "1.1.4", default-features = false, features = ["std", "termios"] }
sandbx-tui-transcript = { path = "../sandbx-tui-transcript" }

[dev-dependencies]
# `Errno` alone, to assert the pty's own `EIO` and not a size from elsewhere; no
# feature gates it, hence none here where `sandbx-tui-input` takes `poll`.
nix = { version = "0.31.3", default-features = false }
# A hangup is tested by opening a pty pair and closing the master; the fixture's own
# `//!` says why it is a crate and not a module (#344).
sandbx-pty-fixture = { path = "../sandbx-pty-fixture" }

[lints]
workspace = true
