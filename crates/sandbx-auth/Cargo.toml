[package]
name = "sandbx-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
# `sandbx-anthropic` does not re-export `secrecy`; keep this at the version it
# resolves, or `AnthropicClient::new` takes a different `SecretString`.
secrecy = "0.10.3"
toml = { version = "1.1.6", default-features = false, features = [
  "parse",
  "display",
  "serde",
] }
# Production, not dev: the credential file is written through a `NamedTempFile`
# in the same directory and renamed, which is what keeps `0600` on a rewrite.
tempfile = "3.27.0"

[lints]
workspace = true
