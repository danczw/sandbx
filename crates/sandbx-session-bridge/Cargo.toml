[package]
name = "sandbx-session-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sandbx-compact = { path = "../sandbx-compact" }
sandbx-providers = { path = "../sandbx-providers" }
# The whole crate for three names now that #360 has taken `SessionId`, until stage 4 of #332
# splits the rest: `sessions_directory` goes to #361, `Session` and `SessionStore` to #362.
# One line to re-point each time, which is why the wide edge is allowed meanwhile.
sandbx-session = { path = "../sandbx-session" }
sandbx-session-error = { path = "../sandbx-session-error" }
sandbx-session-id = { path = "../sandbx-session-id" }
sandbx-session-message = { path = "../sandbx-session-message" }

[lints]
workspace = true

[dev-dependencies]
# Only the tests name it: a stored `input` is cloned here, never constructed, so nothing
# under `src/` spells `serde_json::Value`.
serde_json = "1.0.151"
