[package]
name = "sandbx-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sandbx-core = { path = "../sandbx-core" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Tests that actually spawn sandboxed processes, matching sandbx-core's own
# gating. Excluded from the default run because they need a capable kernel.
sandbox-integration = ["sandbx-core/sandbox-integration"]

# Dispatching helper for the sandboxed-execution tests. `required-features`
# keeps it out of normal builds.
[[bin]]
name = "sandbx-tools-test-helper"
path = "tests/support/helper.rs"
required-features = ["sandbox-integration"]
