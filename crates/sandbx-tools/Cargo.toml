[package]
name = "sandbx-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sandbx-core = { path = "../sandbx-core" }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Needs a sandbox-capable kernel, like `sandbx-core`'s feature of the same name.
sandbox-integration = ["sandbx-core/sandbox-integration"]

[[bin]]
name = "sandbx-tools-test-helper"
path = "tests/support/helper.rs"
required-features = ["sandbox-integration"]
