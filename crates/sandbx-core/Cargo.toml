[package]
name = "sandbx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Needs a kernel with Landlock ABI 5 (Linux 6.10+), so it is out of the default
# `cargo test` run.
sandbox-integration = ["dep:io-uring"]

[dependencies]
# The only way to drop this process's capabilities that stays inside
# `unsafe_code = "forbid"`: nix has no capability module, libc only the raw prctl.
caps = "0.5.6"
landlock = "0.4.7"
libc = "0.2.189"
nix = { version = "0.31.3", default-features = false, features = ["sched", "fs", "signal", "user", "resource"] }
seccompiler = "0.5.0"
sha2 = { version = "0.11.0", default-features = false }
tracing = "0.1.44"
# Optional rather than a dev-dependency because the probe that reaches
# `io_uring_setup` is a `[[bin]]`, and a `[[bin]]` cannot see dev-dependencies.
io-uring = { version = "0.7.15", optional = true }

# Inherited unchanged: the one site allowed to spawn, `spawn::command`, carries
# its own `#[allow]` rather than the crate opting out of the ban.
[lints]
workspace = true

[dev-dependencies]
caps = "0.5.6"
libc = "0.2.189"
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"

[[bin]]
name = "sandbx-truncate-probe"
path = "tests/support/truncate_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-unix-probe"
path = "tests/support/unix_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-iouring-probe"
path = "tests/support/iouring_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-memfd-probe"
path = "tests/support/memfd_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-pidns-probe"
path = "tests/support/pidns_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-egress-probe"
path = "tests/support/egress_probe.rs"
required-features = ["sandbox-integration"]
