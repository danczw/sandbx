[package]
name = "sandbx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Needs a kernel with Landlock ABI 5 (Linux 6.10+), so it is out of the default
# `cargo test` run. Empty since #347 moved the probe that reached `io_uring_setup` to
# `sandbx-helper`: nothing in this crate is gated on it any more, and it stays because
# `sandbx-tools` and `sandbx-helper` both forward to it by name.
sandbox-integration = []

[dependencies]
# The only way to drop this process's capabilities that stays inside
# `unsafe_code = "forbid"`: nix has no capability module, libc only the raw prctl.
caps = "0.5.6"
landlock = "0.4.7"
libc = "0.2.189"
# `dir` is `fdopendir`, the only way to list a directory off a descriptor: `std`'s
# `ReadDir` can be built from a path and nothing else, so a listing rooted at a granted
# descriptor has no std form (#230).
nix = { version = "0.31.3", default-features = false, features = ["dir", "sched", "fs", "mount", "signal", "user", "resource"] }
# A caret range, not `=0.5.0`. Widening past 0.5 needs `eval` in
# `helper/seccomp/tests/bpf.rs` to learn any new opcode first; it panics by name.
seccompiler = "0.5.0"
sha2 = { version = "0.11.0", default-features = false }
tracing = "0.1.44"

# Inherited unchanged: the one site allowed to spawn, `spawn::command`, carries
# its own `#[allow]` rather than the crate opting out of the ban.
[lints]
workspace = true

[dev-dependencies]
caps = "0.5.6"
libc = "0.2.189"
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
