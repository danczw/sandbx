[package]
name = "sandbx-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# For `getuid`, `O_NOFOLLOW` and `ELOOP`: std exposes no uid, and the other two reach
# it only through unstable API. Already in the lock, through `sandbx-core`.
nix = { version = "0.31.3", default-features = false, features = ["fs", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
