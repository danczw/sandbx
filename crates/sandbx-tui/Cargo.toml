[package]
name = "sandbx-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# No default features, and no widget ever drawn here: `crossterm` is only for the
# `event` re-export the key reader reads through.
#
# This pin and `sandbx-screen`'s must move together, and nothing enforces it: the
# reader lock `Keys` takes is crossterm's one global, and it only excludes the
# screen's cursor queries while both crates resolve to the same `crossterm`.
# `sandbx-screen`'s manifest has the full argument (#352).
ratatui = { version = "=0.30.2", default-features = false, features = [
  "crossterm",
] }
# `poll` alone: the key reader gates every call into crossterm on a `poll`, which is
# the only place a hung-up terminal can be seen — crossterm swallows `POLLHUP` and
# spins on the zero-byte read behind it (#264).
nix = { version = "0.31.3", default-features = false, features = ["poll"] }
# `sync` alone: the key thread reaches the turn through a watch channel, and
# nothing here spawns a task or arms a timer.
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }

[dev-dependencies]
# A hangup is tested by opening a pty pair and closing the master; the fixture's own
# `//!` says why it is a crate and not a module (#344).
sandbx-pty-fixture = { path = "../sandbx-pty-fixture" }

[lints]
workspace = true
