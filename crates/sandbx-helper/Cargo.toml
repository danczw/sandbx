[package]
name = "sandbx-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Needs a kernel with Landlock ABI 5 (Linux 6.10+), so it is out of the default
# `cargo test` run. Forwards to `sandbx-core`'s feature of the same name, which is
# what gates the probe that reaches `io_uring_setup`.
sandbox-integration = ["dep:io-uring", "sandbx-core/sandbox-integration"]

[dependencies]
sandbx-core = { path = "../sandbx-core" }
# A real dependency and not a dev-dependency for the same reason `io-uring` is one:
# three of these features are reached from `[[bin]]` probes, and a `[[bin]]` cannot see
# dev-dependencies. `sched` for the pid-namespace probe, `fs` for `memfd` and
# `truncate`, `process` for the orphan probe's `setsid`. `signal` is the exception —
# only `tests/command.rs` reaches it, which could have seen a dev-dependency.
nix = { version = "0.31.3", default-features = false, features = ["sched", "fs", "signal", "process"] }
# Optional rather than a dev-dependency because the probe that reaches
# `io_uring_setup` is a `[[bin]]`, and a `[[bin]]` cannot see dev-dependencies.
io-uring = { version = "0.7.15", optional = true }

[lints]
workspace = true

[dev-dependencies]
caps = "0.5.6"
libc = "0.2.189"
# The enforcement suite's shared fixture. Four roots drive it, and a `#[cfg(test)]` item
# does not cross a crate boundary; it takes the helper's path as an argument because
# `CARGO_BIN_EXE_sandbx-helper` is set only for a target of this package (#333).
sandbx-helper-fixture = { path = "../sandbx-helper-fixture" }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# The one probe outside `sandbox-integration`: concealing a process needs no Landlock ABI,
# only a second process to be concealed from.
[[bin]]
name = "sandbx-concealment-probe"
path = "tests/support/concealment_probe.rs"

[[bin]]
name = "sandbx-truncate-probe"
path = "tests/support/truncate_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-unix-probe"
path = "tests/support/unix_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-socketpair-probe"
path = "tests/support/socketpair_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-iouring-probe"
path = "tests/support/iouring_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-memfd-probe"
path = "tests/support/memfd_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-pidns-probe"
path = "tests/support/pidns_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-orphan-probe"
path = "tests/support/orphan_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-egress-probe"
path = "tests/support/egress_probe.rs"
required-features = ["sandbox-integration"]

[[bin]]
name = "sandbx-resolver-probe"
path = "tests/support/resolver_probe.rs"
required-features = ["sandbox-integration"]
