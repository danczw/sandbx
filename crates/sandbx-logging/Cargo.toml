[package]
name = "sandbx-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sandbx-core = { path = "../sandbx-core" }
# `tracing` discards every event when no subscriber is installed, and a library
# cannot install one; this crate owns the workspace's only subscriber.
# Omitting `ansi` here does not make `lib.rs`'s `with_ansi(false)` redundant —
# a dev-dependency elsewhere in the workspace unifies the feature back on.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
] }

[lints]
workspace = true

[dev-dependencies]
# Only the tests name a `tracing` macro; `subscriber` returns
# `impl SubscriberInitExt` so that stays true.
tracing = "0.1.44"
tempfile = "3.27.0"
# `rt` alone: `audit_log_held.rs` needs a current-thread runtime for one
# `spawn_blocking` task.
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
